name = "cf-photos"
main = "src/index.js"
compatibility_date = "2024-04-03"

[vars]
# 生成图片路径与文件名时使用的时区偏移（小时，支持 5.5 这类半时区）
# 留空或非法时回退到 8（东八区）；Workers 运行时恒为 UTC
TIMEZONE_OFFSET = "8"

# 单次上传体积上限（MB），仅用于后台上传前的预检提示。
# 真正的上限由 Cloudflare 账户套餐在边缘强制，超限请求根本到不了 Worker：
# Free/Pro 100、Business 200、Enterprise 默认 500（可自助调到 5120）。
# 默认 95 是给 Free/Pro 的 100 留余量；换套餐时改这里即可。
MAX_UPLOAD_MB = "95"

# 媒体读取缓存的 L2（全球一份）。见 src/services/CachedStorage.js。
# 纯缓存，不是数据源：里面每个条目都能从 WebDAV 重新取回，随时可以整个清空或重建。
# 绑定缺失时缓存层自动退化成对 WebDAV 的纯透传，不会报错。
# 换账号或另起一套部署时，用 npx wrangler kv namespace create PHOTO_CACHE 重建并替换下面的 id。
# wrangler dev 不看这个 id，本地会自动起一个同名的替身。
[[kv_namespaces]]
binding = "PHOTO_CACHE"
id = "25948693abef432290d9c001040916ad"

# Worker Previews（非 main 分支推送时由 npx wrangler preview 创建的预览环境，需要 wrangler ≥ 4.143）。
# 预览不继承上面的 [vars] 和 [[kv_namespaces]]，这个块本身是必需的，只写预览要用的值。
# 密钥不写在这里，统一放在预览的 base config 里（所有分支共用，与生产互不可见）：
#   npx wrangler preview base-config secret put AUTH_TOKEN   # 必配，且与生产不同：缺了上传/列表/删除会无鉴权放行
#   npx wrangler preview base-config secret put WEBDAV_URL   # 指向独立目录，如 https://<host>/dav/i-preview
#   npx wrangler preview base-config secret put WEBDAV_USERNAME
#   npx wrangler preview base-config secret put WEBDAV_PASSWORD
# PHOTO_CACHE 刻意不配：没有 KV 绑定时 CachedStorage 自动退化为直读 WebDAV，预览不会碰生产缓存。
[previews.vars]
TIMEZONE_OFFSET = "8"
MAX_UPLOAD_MB = "95"
