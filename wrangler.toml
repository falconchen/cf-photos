name = "cf-photos"
main = "src/index.js"
compatibility_date = "2024-04-03"

[vars]
# 生成图片路径与文件名时使用的时区偏移（小时，支持 5.5 这类半时区）
# 留空或非法时回退到 8（东八区）；Workers 运行时恒为 UTC
TIMEZONE_OFFSET = "8"

# 单次上传体积上限（MB），仅用于后台上传前的预检提示。
# 真正的上限由 Cloudflare 账户套餐在边缘强制，超限请求根本到不了 Worker：
# Free/Pro 100、Business 200、Enterprise 默认 500（可自助调到 5120）。
# 默认 95 是给 Free/Pro 的 100 留余量；换套餐时改这里即可。
MAX_UPLOAD_MB = "95"

# 上传时自动把 JPEG / PNG / HEIC 转成 WebP（默认关闭）。见 src/services/WebpConverter.js。
# 转码由自托管的 imaginary 服务完成，打开前还要配置两个 secret（不写在这里）：
#   npx wrangler secret put WEBP_CONVERTER_URL     # 如 https://webp.example.com，必须 HTTPS
#   npx wrangler secret put WEBP_CONVERTER_TOKEN   # imaginary 的 API Key
# 转换服务不可用、超时、转出来比原图大、类型不在白名单（webp/gif/svg/avif 等）、
# 流式上传缺 Content-Length 或超过 20 MB 时一律存原图，上传不会失败。
# PUT /i/... 指定路径的上传永远不转。
AUTO_WEBP = "false"

# 自动转 WebP 的编码质量，1–100，非法时回退到 85。
WEBP_QUALITY = "85"

# 媒体读取缓存的 L2（全球一份）。见 src/services/CachedStorage.js。
# 纯缓存，不是数据源：里面每个条目都能从 WebDAV 重新取回，随时可以整个清空或重建。
# 绑定缺失时缓存层自动退化成对 WebDAV 的纯透传，不会报错。
# 换账号或另起一套部署时，用 npx wrangler kv namespace create PHOTO_CACHE 重建并替换下面的 id。
# wrangler dev 不看这个 id，本地会自动起一个同名的替身。
[[kv_namespaces]]
binding = "PHOTO_CACHE"
id = "25948693abef432290d9c001040916ad"
